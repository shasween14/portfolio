<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upwork Job Samples — Website Update Proposal</title>
<style>
  :root{
    --bg:#0b1020; --card:#141c33; --border:#243156;
    --text:#e7ecf5; --muted:#9aa6c4;
    --brand:#ff2d20; --brand-2:#f9603a; --accent:#5b8cff; --accent-2:#22d3ee; --ok:#34d399;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:#070a16;color:var(--text);padding:30px}
  .page-head{max-width:1024px;margin:0 auto 26px;text-align:center}
  .page-head h1{font-size:1.5rem;font-weight:800}
  .page-head p{color:var(--muted);margin-top:8px;font-size:.95rem;line-height:1.6}
  .dl{display:inline-block;margin:10px auto 0;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;
      background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0;cursor:pointer}
  .dl.all{background:transparent;border:1px solid var(--border);color:var(--text)}

  .cover-wrap{max-width:1024px;margin:0 auto 40px}
  .cover-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cover-bar .lbl{color:var(--muted);font-size:.85rem}

  .cover{
    width:1024px;height:768px;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 460px at 82% -8%,rgba(91,140,255,.18),transparent 60%),
      radial-gradient(760px 420px at -8% 8%,rgba(255,45,32,.16),transparent 55%),
      var(--bg);
    border:1px solid var(--border);border-radius:18px;
    padding:64px 70px;display:flex;flex-direction:column;
  }
  .scaler{transform-origin:top left;}
  .kicker{color:var(--brand-2);font-weight:800;font-size:1rem;letter-spacing:3px;text-transform:uppercase}
  .cover h2{font-size:3.1rem;line-height:1.06;font-weight:800;letter-spacing:-1.5px;margin-top:18px;max-width:880px}
  .cover h2 .grad{color:var(--brand-2)}
  .sub{color:var(--muted);font-size:1.25rem;margin-top:22px;max-width:780px;line-height:1.5}
  .feats{margin-top:30px;display:flex;flex-direction:column;gap:12px}
  .feats div{font-size:1.12rem;color:#cfd6e8;padding-left:30px;position:relative}
  .feats div::before{content:"▹";position:absolute;left:0;color:var(--brand-2);font-size:1.2rem}
  .spacer{flex:1}
  .stack{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
  .tag{font-size:1rem;background:var(--card);border:1px solid var(--border);color:#cdd5ea;padding:8px 15px;border-radius:10px}
  .tag.hot{border-color:rgba(255,45,32,.5);color:#ffb3aa;background:rgba(255,45,32,.10)}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:22px}
  .foot .who{font-weight:800;font-size:1.2rem;letter-spacing:.5px}
  .foot .role{color:var(--muted);font-size:1rem}

  /* numbered step layout for the process card */
  .steps{margin-top:34px;display:flex;flex-direction:column;gap:20px}
  .step{display:flex;gap:20px;align-items:flex-start}
  .step .n{flex:0 0 42px;height:42px;border-radius:12px;background:rgba(255,45,32,.12);
    border:1px solid rgba(255,45,32,.45);color:#ffb3aa;font-weight:800;font-size:1.15rem;
    display:flex;align-items:center;justify-content:center}
  .step .t{font-size:1.2rem;font-weight:700;color:#fff}
  .step .d{font-size:1.02rem;color:var(--muted);margin-top:3px;line-height:1.45;max-width:760px}
</style>
</head>
<body>

<div class="page-head">
  <h1>Upwork Samples — "Update Existing Websites" job</h1>
  <p>Four cards at 1024&times;768, written for a front-end / look-and-feel job rather than backend work.<br>
  Click <strong>Download PNG</strong> under each, then attach them to the proposal. No domain or contact details on any card.</p>
  <button class="dl all" onclick="downloadAll()">&#11015; Download all 4</button>
</div>

<div id="covers"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const COVERS = [
  {
    id:"process",
    kicker:"How I Work",
    title:["Audit first, then ", "fix, then build"],
    sub:"You see the full list of problems and what each one costs before any money is spent on features.",
    steps:[
      ["1","Audit both sites","Desktop and mobile, page by page. You get one written document: what is broken, what is slow, what is worth adding."],
      ["2","Fix look &amp; feel","Consistent type, spacing and colour. Proper responsive layout. Faster load."],
      ["3","Build features","Priced per item from the audit, so you approve each one before I start."]
    ],
    stack:[["Written audit",1],["Fixed pricing",0],["No surprises",0]],
    role:"Front-end &amp; Full-Stack"
  },
  {
    id:"responsive-portals",
    kicker:"Responsive Front-End",
    title:["One React front-end, ", "three different portals"],
    sub:"Admin, operator and customer views sharing one component library — consistent on desktop, tablet and phone.",
    feats:[
      "React 18 + TypeScript + Vite &middot; shared UI components",
      "Role-based layouts from a single responsive codebase",
      "Live dashboards, tables, filters and forms"
    ],
    stack:[["React 18",1],["TypeScript",0],["Vite",0],["Responsive UI",0]],
    role:"Lead Developer"
  },
  {
    id:"mobile-ui",
    kicker:"Mobile-First Interface",
    title:["A UI that works ", "on any screen", " — even offline"],
    sub:"A checkout interface built mobile-first, then packaged as a real Android app from the same front-end code.",
    feats:[
      "Ionic 8 + React &middot; touch-first layout and navigation",
      "Works with no connection &middot; local data with IndexedDB",
      "End-to-end tested with Cypress"
    ],
    stack:[["React",1],["TypeScript",0],["Ionic",0],["Mobile-first",0]],
    role:"Solo Build"
  },
  {
    id:"fast-site",
    kicker:"Website Build",
    title:["A fast site with ", "no framework bloat"],
    sub:"My own portfolio site — one hand-written HTML file with custom CSS, scroll animations and a full responsive layout.",
    feats:[
      "Hand-written HTML &amp; CSS &middot; zero dependencies, loads instantly",
      "Responsive down to small phones &middot; dark, modern design",
      "Scroll-reveal animations with plain JavaScript"
    ],
    stack:[["HTML",1],["CSS",0],["JavaScript",0],["No frameworks",0]],
    role:"Solo Build"
  }
];

function titleHTML(parts){
  return parts.map(function(p,i){ return i%2===1 ? '<span class="grad">'+p+'</span>' : p; }).join("");
}

const root = document.getElementById('covers');
COVERS.forEach(function(c,idx){
  const body = c.steps
    ? '<div class="steps">' + c.steps.map(function(s){
        return '<div class="step"><div class="n">'+s[0]+'</div>'+
               '<div><div class="t">'+s[1]+'</div><div class="d">'+s[2]+'</div></div></div>';
      }).join("") + '</div>'
    : '<div class="feats">' + c.feats.map(function(f){ return '<div>'+f+'</div>'; }).join("") + '</div>';

  const wrap = document.createElement('div');
  wrap.className = 'cover-wrap';
  wrap.innerHTML =
    '<div class="cover-bar">' +
      '<span class="lbl">Sample ' + (idx+1) + ' &middot; ' + c.kicker + ' &middot; 1024&times;768</span>' +
      '<button class="dl" onclick="dl(\'' + c.id + '\',\'sample-' + (idx+1) + '-' + c.id + '\')">&#11015; Download PNG</button>' +
    '</div>' +
    '<div class="scaler" id="scaler-' + c.id + '">' +
      '<div class="cover" id="' + c.id + '">' +
        '<div class="kicker">' + c.kicker + '</div>' +
        '<h2>' + titleHTML(c.title) + '</h2>' +
        '<div class="sub">' + c.sub + '</div>' +
        body +
        '<div class="spacer"></div>' +
        '<div class="stack">' + c.stack.map(function(t){
            return '<span class="tag ' + (t[1] ? 'hot' : '') + '">' + t[0] + '</span>';
          }).join("") + '</div>' +
        '<div class="foot">' +
          '<div class="who">Shaswin K.</div>' +
          '<div class="role">' + c.role + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  root.appendChild(wrap);
});

function fit(){
  const avail = Math.min(1024, document.body.clientWidth - 60);
  const s = avail/1024;
  document.querySelectorAll('.scaler').forEach(function(el){
    el.style.transform = 'scale(' + s + ')';
    el.style.height = (768*s) + 'px';
  });
}
window.addEventListener('resize', fit); fit();

async function dl(id, filename){
  const node = document.getElementById(id);
  const canvas = await html2canvas(node, {width:1024,height:768,scale:1,backgroundColor:null});
  const a = document.createElement('a');
  a.download = filename + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
async function downloadAll(){
  for(const c of COVERS){
    const i = COVERS.indexOf(c)+1;
    await dl(c.id, 'sample-' + i + '-' + c.id);
    await new Promise(function(r){ setTimeout(r,400); });
  }
}
</script>
</body>
</html>
